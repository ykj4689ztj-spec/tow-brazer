
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تشطيب كهرباء | Tow Brazer</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:#e2e8f0;
}

header {
  text-align:center;
  padding:35px 15px;
  background:#020617;
  border-bottom:2px solid #d4af37;
}

h1 { color:#d4af37; margin-bottom:12px; }

.back {
  display:inline-block;
  margin-top:20px;
  padding:12px 22px;
  background:#d4af37;
  color:#020617;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}

.container {
  max-width:1100px;
  margin:auto;
  padding:25px 15px;
}

h2 { color:#d4af37; margin-bottom:20px; }

.gallery {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.gallery img {
  width:100%;
  height:190px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid #d4af37;
  cursor:pointer;
}

.empty {
  grid-column:1/-1;
  text-align:center;
  padding:35px 10px;
}

.contact {
  text-align:center;
  padding:30px 10px;
}

.contact a {
  display:inline-block;
  background:#25d366;
  color:white;
  padding:13px 25px;
  border-radius:8px;
  text-decoration:none;
}

#viewer {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  justify-content:center;
  align-items:center;
  padding:15px;
}

#viewer img {
  max-width:100%;
  max-height:85vh;
  object-fit:contain;
}

@media(min-width:700px) {
  .gallery { grid-template-columns:repeat(3,1fr); }
  .gallery img { height:250px; }
}
</style>
</head>

<body>

<header>
<h1>تشطيب كهرباء</h1>
<p>Tow Brazer - أعمال تشطيب الكهرباء</p>
<a href="index.html" class="back">العودة للموقع الرئيسي</a>
</header>

<main class="container">
<h2>معرض أعمال التشطيب</h2>

<div class="gallery" id="gallery">
<div class="empty">صور أعمال التشطيب ستظهر هنا بعد إضافتها.</div>
</div>
</main>

<div class="contact">
<h3 style="margin-bottom:15px;">عايز تنفذ تشطيب كهرباء؟</h3>
<a href="https://wa.me/201124877770" target="_blank">
تواصل معنا عبر واتساب
</a>
</div>

<div id="viewer" onclick="this.style.display='none'">
<img id="largeImage" src="" alt="أعمال تشطيب الكهرباء">
</div>

<script>
const photos = [
  // "images/finishing1.jpg",
  // "images/finishing2.jpg",
  // "images/finishing3.jpg"
];

const gallery = document.getElementById("gallery");

if (photos.length > 0) {
  gallery.innerHTML = "";

  photos.forEach(photo => {
    const img = document.createElement("img");
    img.src = photo;
    img.alt = "أعمال تشطيب كهرباء";
    img.onclick = () => {
      document.getElementById("largeImage").src = photo;
      document.getElementById("viewer").style.display = "flex";
    };
    gallery.appendChild(img);
  });
}
</script>

</body>
</html>
